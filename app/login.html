<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claims Triage: access</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2a4e 0%, #0b1324 60%); color: #0f172a; -webkit-font-smoothing: antialiased; }
    .wrap { width: min(400px, 100%); }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; justify-content: center; margin-bottom: 20px; font-weight: 650; font-size: 1.1rem; }
    .brand svg { width: 28px; height: 28px; color: #7aa2ff; }
    .pill { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; background: rgba(122,162,255,.16); color: #b9ccff; border: 1px solid rgba(122,162,255,.3); }
    form { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    h1 { font-size: 1.15rem; margin: 0 0 4px; letter-spacing: -.01em; }
    .sub { color: #64748b; font-size: .9rem; margin: 0 0 20px; }
    label { font-size: .88rem; font-weight: 550; color: #334155; }
    input { font: inherit; width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
    input:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,.15); }
    button { font: inherit; font-weight: 600; width: 100%; padding: 11px; margin-top: 16px; background: #1d4ed8; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1e40af; }
    p { color: #64748b; font-size: .82rem; margin: 14px 0 0; }
    .err { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 8px 12px; font-size: .88rem; }
    .foot { color: #94a3b8; text-align: center; font-size: .78rem; margin-top: 16px; }
    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6l-9-4Z" fill="currentColor" opacity=".18"/><path d="M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6l-9-4Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Claims Triage <span class="pill">Prototype</span>
    </div>
    <form method="post" action="/login">
      <h1>Sign in</h1>
      <p class="sub">Vehicle damage claims triage</p>
      <label for="code">Access code</label>
      <input id="code" name="code" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Continue</button>
      <!--ERROR-->
      <p>The code is kept for this browser session only.</p>
    </form>
    <div class="foot">Triage aid only. Never decides coverage, liability or payment.</div>
  </div>
</body>
</html>
